name: Library registry entry
description: Add a software library to the registry or change an existing entry.
title: "[Registry] "
labels: ["registry"]
body:
  - type: input
    id: name
    attributes:
      label: Name
      description: Name of the library.
    validations:
      required: true
  - type: textarea
    id: repositories
    attributes:
      label: Repositories
      description: 'One to four source repositories, one per line, as a language and an HTTPS link, for example Rust: https://github.com/example/lib.'
    validations:
      required: true
  - type: textarea
    id: algorithms
    attributes:
      label: Algorithms
      description: List every post-quantum algorithm the library implements, one per line.
    validations:
      required: true
  - type: dropdown
    id: hybrid
    attributes:
      label: Hybrid
      description: Choose Yes if the library combines a classical and a post-quantum signature that must both verify.
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: dropdown
    id: maturity
    attributes:
      label: Maturity
      description: If the project warns against production use, do not choose production.
      options:
        - experimental
        - pre-production
        - production
    validations:
      required: true
  - type: dropdown
    id: blockchain_friendly
    attributes:
      label: Blockchain friendly
      description: Choose Yes if the library ships configurations designed for blockchains.
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: textarea
    id: audits
    attributes:
      label: Audits
      description: 'Published audit reports, one per line, as the auditor and an HTTPS link, for example Oak Security: https://example.org/report. Leave empty if there are none.'
  - type: input
    id: min_signature
    attributes:
      label: Smallest signature size
      description: Size in bytes and the parameter set, for example "666 B (Falcon-512)". Leave empty if not documented.
  - type: input
    id: min_public_key
    attributes:
      label: Smallest public key size
      description: Size in bytes and the parameter set, for example "897 B (Falcon-512)". Leave empty if not documented.
  - type: input
    id: note
    attributes:
      label: Note (up to 5 words)
      description: A short note that clarifies one thing. Leave empty if none.
  - type: textarea
    id: links
    attributes:
      label: Links (up to 2)
      description: The most useful public sources, one per line, as a title and an HTTPS link. Leave empty if none.
  - type: textarea
    id: evidence
    attributes:
      label: Source for this information
      description: Public links that support the entry. A reader must be able to open each link.
    validations:
      required: true
