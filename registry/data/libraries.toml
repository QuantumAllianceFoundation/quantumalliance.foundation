[[library]]
name = "hashsigs"
repositories = [
  { language = "Rust", url = "https://github.com/QuipNetwork/hashsigs-rs" },
  { language = "Solidity", url = "https://github.com/QuipNetwork/hashsigs-solidity" },
]
algorithms = ["shrincs", "sphincs-plus-c", "wots-plus"]
hybrid = false
maturity = "production"
blockchain_friendly = true
audits = [
  { auditor = "Oak Security", url = "https://github.com/oak-security/audit-reports/blob/main/Quip/2026-09-24%20Audit%20Report%20-%20Quip%20v1.0.pdf", logo = "oak-security.svg" },
]
min_signature = { bytes = 1092, parameter_set = "SHRINCS 128s-q18 (stateful, first leaf)" }
min_public_key = { bytes = 64, parameter_set = "SPHINCS+C (stateless public key)" }
note = "Audit covers Solidity only"
links = [
  { title = "Audited verifiers branch", url = "https://github.com/QuipNetwork/hashsigs-solidity/tree/chore/audit-report" },
]

[[library]]
