# Library registry
#
# One [[library]] block per software library. To add or change an entry, edit
# this file and open a pull request. Take every value from the library's own
# documentation, its source, or a published audit report. If a value is not
# documented, leave out the optional field.
#
# Fields:
#   name                 Required. Unique, compared without regard to case.
#   source               Required. HTTPS link to the source repository.
#   algorithms           Required, not empty. List of ids from algorithms.toml.
#                        List every algorithm the library implements.
#   maturity             Required. One of:
#                          "experimental"    early or unstable, or not maintained
#                          "pre-production"  usable, but the project does not
#                                            yet call it ready for production
#                          "production"      the project or a live network uses
#                                            it in production
#                        If the project warns against production use, do not
#                        choose "production".
#   blockchain_friendly  Required. true or false. Use true only if the library
#                        ships code or configurations made for blockchains,
#                        such as on-chain verifiers.
#   audits               Optional, default []. Published audit reports. Each
#                        has a `title` that names the auditor and the year and
#                        an HTTPS `url`. A library with at least one audit
#                        shows as audited.
#   min_signature        Optional. Smallest signature size in bytes across the
#                        parameter sets the library ships, as
#                        { bytes = 666, parameter_set = "Falcon-512" }.
#   min_public_key       Optional. Smallest public key size in bytes, in the
#                        same form as min_signature.
#   note                 Optional. At most 5 words that clarify one thing.
#   links                Optional, default []. At most 2 links to the best
#                        sources, as { title = "...", url = "https://..." }.
#
# Example (a copy of the qp-rusty-crystals entry below, shortened):
#   [[library]]
#   name = "qp-rusty-crystals"
#   source = "https://github.com/Quantus-Network/qp-rusty-crystals"
#   algorithms = ["ml-dsa"]
#   maturity = "production"
#   blockchain_friendly = true
#   audits = [{ title = "Neodyme audit of Dilithium and HDWallet (2025)", url = "https://github.com/Quantus-Network/qp-rusty-crystals/blob/master/audits/Neodyme-Audit.pdf" }]
#   min_signature = { bytes = 2420, parameter_set = "ML-DSA-44" }
#   min_public_key = { bytes = 1312, parameter_set = "ML-DSA-44" }
#   note = "Audit covered ML-DSA-87 only"

[[library]]
name = "liboqs"
source = "https://github.com/open-quantum-safe/liboqs"
algorithms = ["ml-kem", "ml-dsa", "fn-dsa", "slh-dsa", "xmss", "lms"]
maturity = "pre-production"
blockchain_friendly = false
min_signature = { bytes = 666, parameter_set = "Falcon-padded-512" }
min_public_key = { bytes = 32, parameter_set = "SLH-DSA-SHA2-128s" }
note = "Not recommended for production"

[[library]]
name = "PQClean"
source = "https://github.com/PQClean/PQClean"
algorithms = ["ml-kem", "ml-dsa", "fn-dsa", "sphincs-plus"]
maturity = "experimental"
blockchain_friendly = false
min_signature = { bytes = 666, parameter_set = "Falcon-padded-512" }
min_public_key = { bytes = 32, parameter_set = "SPHINCS+-sha2-128s-simple" }
note = "Retired; archived read-only"

[[library]]
name = "algorand/falcon"
source = "https://github.com/algorand/falcon"
algorithms = ["fn-dsa"]
maturity = "production"
blockchain_friendly = true
min_signature = { bytes = 713, parameter_set = "Falcon-DET512 (compressed, maximum)" }
min_public_key = { bytes = 897, parameter_set = "Falcon-DET512" }
note = "Deterministic signing mode"

[[library]]
name = "qp-rusty-crystals"
source = "https://github.com/Quantus-Network/qp-rusty-crystals"
algorithms = ["ml-dsa"]
maturity = "production"
blockchain_friendly = true
audits = [
  { title = "Neodyme audit of Dilithium and HDWallet (2025)", url = "https://github.com/Quantus-Network/qp-rusty-crystals/blob/master/audits/Neodyme-Audit.pdf" },
]
min_signature = { bytes = 2420, parameter_set = "ML-DSA-44" }
min_public_key = { bytes = 1312, parameter_set = "ML-DSA-44" }
note = "Audit covered ML-DSA-87 only"

