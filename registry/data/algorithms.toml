# Algorithm catalog
#
# Blockchains and libraries refer to these entries by `id`. To add an
# algorithm, copy an existing [[algorithm]] block, change the values, and open
# a pull request. The "Safety" rating shown on the site comes from `family`:
# hash-based = High, lattice = Medium, other = Low.
#
# Fields (all required):
#   id      Unique lowercase slug: letters, digits, and single hyphens.
#           Example: "ml-dsa"
#   name    Display name. Example: "ML-DSA"
#   family  One of: "hash-based", "lattice", "other"
#   url     HTTPS link to the standard or the specification. Use the
#           publication page of the standards body, the RFC page, or the
#           paper that defines the scheme. The link must start with the
#           secure scheme and must open without a login.
#
# Example:
#   [[algorithm]]
#   id = "ml-dsa"
#   name = "ML-DSA"
#   family = "lattice"
#   url = "https://csrc.nist.gov/pubs/fips/204/final"

