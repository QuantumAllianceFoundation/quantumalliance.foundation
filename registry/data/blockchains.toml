# Blockchain registry
#
# One [[chain]] block per blockchain. To add or change an entry, edit this file
# and open a pull request. Every claim needs a public source that a reader can
# open. If you are not sure which value fits, pick the less ready one.
#
# Each chain gets a value for two layers, `consensus` and `transactions`. The
# page lists chains by transactions, then consensus, then name. Values:
#   post-quantum         The layer has deployed a post-quantum solution.
#   no-signatures        Consensus only. The layer does not use digital
#                        signatures, for example proof-of-work mining, which
#                        relies on hashing.
#   post-quantum-ready   The layer has published source code for a
#                        post-quantum solution that is not yet deployed.
#   quantum-aware        The layer is not yet post-quantum, but it is working
#                        on solutions expected to mitigate most of the risk,
#                        and a team is on top of the transition.
#   quantum-vulnerable   No work, or some work with no clear deployment path.
#
# Fields:
#   name          Required. Unique, compared without regard to case.
#   consensus     Required. Value for the consensus layer: one of the five
#                 values above.
#   transactions  Required. Value for the transaction layer: one of the four
#                 values above, without no-signatures.
#   consensus_reason
#                 Required. Why the consensus value fits, in plain language,
#                 in your own words, at most 40 words. Do not copy sentences
#                 from a source. Name the evidence, such as a repository, a
#                 pull request, or a published plan. Where the value is a
#                 judgment call, start with "Judgment call:". Do not use
#                 double quotes.
#   transactions_reason
#                 Required. Why the transactions value fits. Same rules as
#                 consensus_reason.
#   website       Required. HTTPS link to the project website.
#   source        Optional. HTTPS link to the GitHub organization or the
#                 main node or protocol repository. Leave it out when the
#                 project has published no node or protocol code; never point
#                 it at a docs page or a configuration-only repository.
#   algorithms    Optional, default []. List of ids from algorithms.toml. Name
#                 only post-quantum algorithms that the chain has deployed or
#                 implemented. A quantum-vulnerable chain can leave it empty.
#   note          Optional. At most 5 words that clarify one thing.
#   links         Optional, default []. At most 2 links to the best sources.
#                 Each has a `title` that names the document plainly and an
#                 HTTPS `url`.
#   logo          Optional. File name in assets/registry/logos/ (.svg, .png,
#                 or .webp; at most 64 KB; an SVG has no script or on*
#                 attributes). Use the project's official mark.
#
# Example (a copy of the Bitcoin entry below):
#   [[chain]]
#   name = "Bitcoin"
#   consensus = "no-signatures"
#   transactions = "quantum-vulnerable"
#   consensus_reason = "Proof-of-work mining relies on SHA-256 hashing (Bitcoin whitepaper), so consensus uses no signatures."
#   transactions_reason = "Spending uses ECDSA and Schnorr signatures on secp256k1. BIP-360 and BIP-361 are Draft proposals, with no activation path."
#   website = "https://bitcoin.org/"
#   source = "https://github.com/bitcoin/bitcoin"
#   note = "PoW consensus has no signatures"
#   links = [
#     { title = "BIP-360", url = "https://github.com/bitcoin/bips/blob/master/bip-0360.mediawiki" },
#   ]

