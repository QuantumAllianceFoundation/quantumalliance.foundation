# Blockchain registry
#
# One [[chain]] block per blockchain. To add or change an entry, edit this file
# and open a pull request. Every claim needs a public source that a reader can
# open. If you are not sure which category fits, pick the less ready one.
#
# Categories (field `category`):
#   post-quantum         The chain has deployed a post-quantum solution.
#   post-quantum-ready   The chain has published source code for a
#                        post-quantum solution that is not yet deployed.
#   quantum-aware        The chain is not yet post-quantum, but it is working
#                        on solutions expected to mitigate most of the risk,
#                        and a team is on top of the transition.
#   quantum-vulnerable   No work, or some work with no clear deployment path.
#
# Fields:
#   name        Required. Unique, compared without regard to case.
#   category    Required. One of the four values above.
#   website     Required. HTTPS link to the project website.
#   source      Required. HTTPS link to the GitHub organization or the
#               main source code repository.
#   algorithms  Optional, default []. List of ids from algorithms.toml. Name
#               only post-quantum algorithms that the chain has deployed or
#               implemented. A quantum-vulnerable chain can leave it empty.
#   notes       Optional, default []. Links to documents that support the
#               category. Each note has a `title` that names the document
#               plainly and an HTTPS `url`.
#
# Example (a copy of the Sui entry below):
#   [[chain]]
#   name = "Sui"
#   category = "post-quantum-ready"
#   website = "https://www.sui.io/"
#   source = "https://github.com/MystenLabs/sui"
#   algorithms = ["ml-dsa"]
#   notes = [
#     { title = "Making Sui Quantum Ready (2026)", url = "https://www.sui.io/blog/making-sui-quantum-ready" },
#   ]

