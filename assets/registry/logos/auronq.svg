    <stop offset="0" stop-color="#ffffff"/><stop offset=".28" stop-color="#e8efff"/>
    <stop offset=".55" stop-color="#b7c8f4"/><stop offset=".77" stop-color="#ffffff"/><stop offset="1" stop-color="#8da8e8"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#25e7ff"/><stop offset=".42" stop-color="#176cff"/>
