[[algorithm]]
id = "ml-dsa"
name = "ML-DSA"
family = "lattice"
kind = "signature"
url = "https://csrc.nist.gov/pubs/fips/204/final"
summary = "A lattice-based digital signature scheme standardized by NIST."
rationale = "Security rests on structured lattice problems, whose cryptanalysis is still younger than hash-function analysis."
papers = [{ title = "ML-DSA (FIPS 204)", url = "https://csrc.nist.gov/pubs/fips/204/final" }]

[[algorithm]]
id = "slh-dsa"
name = "SLH-DSA"
family = "hash-based"
kind = "signature"
url = "https://csrc.nist.gov/pubs/fips/205/final"
summary = "A hash-based digital signature scheme standardized by NIST."
rationale = "Security relies only on the hash function, with no other assumption. Signatures are large."
papers = [{ title = "SLH-DSA (FIPS 205)", url = "https://csrc.nist.gov/pubs/fips/205/final" }]

